services:

  frontend:
    build: ./frontend
    container_name: three-tier-frontend
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net

  backend:
    build: ./backend
    container_name: three-tier-backend
    expose:
      - "5000"
    environment:
      DB_HOST: database
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  database:
    image: mysql:8.0
    container_name: three-tier-database
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -prootpassword"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  frontend_net:
    driver: bridge

  backend_net:
    driver: bridge

volumes:
  mysql_data:
